<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CJC Clinic</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#A5192D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CJC Clinic" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400&family=Mulish:wght@300;400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#A5192D;">
        <div style="text-align:center;">
          <div style="width:36px;height:36px;border:3px solid #f1f5f9;border-top:3px solid #A5192D;border-radius:50%;animation:cjcspin 0.8s linear infinite;margin:0 auto 12px;"></div>
          <p style="font-size:13px;font-weight:600;color:#64748b;margin:0;">Loading CJC Clinic...</p>
        </div>
      </div>
      <style>
        @keyframes cjcspin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically unregister service worker in dev mode so Cloudflare tunnels don't lag or cache modules
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
